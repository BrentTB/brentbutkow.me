<!doctype html>
<!-- 1200x630 Open Graph card template. Rendered to PNG by scripts/generate-og.mjs via headless
     Chrome; pick a card with ?v=<key>, where the keys are those of the `variants` object below.
     Mirrors the site's design tokens (ink bg, warm gold accent, IBM Plex) and the terminal ~/ path
     motif. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0c0f;
        --accent: #e9b872;
        --text: #f3efe7;
        --text-secondary: #cdc9c0;
        --muted: #8d8a82;
        --border: rgba(255, 255, 255, 0.09);
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: var(--bg);
        font-family: 'IBM Plex Sans', sans-serif;
        color: var(--text);
        overflow: hidden;
      }
      .card {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 72px 84px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .glow {
        position: absolute;
        top: -300px;
        right: -200px;
        width: 900px;
        height: 900px;
        background: radial-gradient(circle, rgba(233, 184, 114, 0.14) 0%, transparent 60%);
      }
      .path {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: 0.06em;
        color: var(--accent);
        margin-bottom: 28px;
      }
      .caret {
        display: inline-block;
        width: 16px;
        height: 34px;
        margin-left: 6px;
        vertical-align: text-bottom;
        background: var(--accent);
      }
      .title {
        font-size: 96px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.02;
        margin-bottom: 30px;
      }
      .subtitle {
        max-width: 21em;
        font-size: 34px;
        line-height: 1.45;
        color: var(--text-secondary);
      }
      .tags {
        display: flex;
        gap: 14px;
        margin-top: 34px;
      }
      /* `display: flex` outranks the `hidden` attribute, so an empty row keeps its margin without this. */
      .tags[hidden] {
        display: none;
      }
      .tag {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 22px;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 18px;
      }
      .brand {
        position: absolute;
        left: 84px;
        bottom: 56px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 26px;
        color: var(--muted);
      }
      .brand .prompt {
        color: var(--accent);
        margin-right: 12px;
      }
      .stars span {
        position: absolute;
        border-radius: 50%;
        background: rgba(243, 239, 231, 0.7);
      }
      /* A slab of the world itself down the right-hand edge: sky, grains mid-fall, then the strata. The card
         for a falling-sand sandbox should be made of cells, and the text column ends well clear of it. */
      /* With the world down the right-hand edge, the title has to wrap rather than run into it: at 96px,
         "Pixel World Simulator" reaches within 200px of the far edge on one line. */
      .card.hasStrata .title {
        max-width: 620px;
        /* A two-line title plus a subtitle and a tag overran the card at 96px and drove the tag into the
           brand line, which is pinned to the bottom. */
        font-size: 78px;
      }
      .card.hasStrata .subtitle {
        /* Two lines, not three: the text column has room to 798px before the world's edge, and a third line
           pushed the tag into the brand line pinned at the bottom. */
        max-width: 21em;
      }
      /* The bloom the renderer composites over anything alight. A blurred pass in the sim, a soft radial here
         — sitting over the crater in the slab, well clear of the text column. */
      .blast {
        position: absolute;
        left: 1000px;
        top: 200px;
        width: 300px;
        height: 300px;
        background: radial-gradient(
          circle,
          rgba(255, 196, 92, 0.5) 0%,
          rgba(240, 120, 40, 0.26) 34%,
          transparent 66%
        );
      }
      .strata {
        position: absolute;
        top: 0;
        right: 0;
        width: 380px;
        height: 630px;
        image-rendering: pixelated;
        -webkit-mask-image: linear-gradient(to right, transparent, #000 90px);
        mask-image: linear-gradient(to right, transparent, #000 90px);
      }
      /* The right-hand column the later cards put their signature in, faded off at its inner edge so the
         text never runs into hard art. Same footprint as the pixel world's slab. */
      .edgeArt {
        position: absolute;
        top: 0;
        right: 0;
        width: 380px;
        height: 630px;
        -webkit-mask-image: linear-gradient(to right, transparent, #000 110px);
        mask-image: linear-gradient(to right, transparent, #000 110px);
      }
      /* With art down the right-hand edge the text column stops at 620px, so a long title wraps rather
         than running under it. */
      .card.hasEdgeArt .title {
        max-width: 620px;
        font-size: 82px;
      }
      .card.hasEdgeArt .subtitle {
        max-width: 19em;
      }

      /* Malicious UX: a scrap of somebody else's bright, hostile website in its case, with the No button
         caught mid-hop and the cursor still back where it started. */
      .specimen {
        position: absolute;
        top: 128px;
        left: 74px;
        right: -60px;
        bottom: 128px;
        background: #ffffff;
        border-radius: 12px;
      }
      .specimenLine {
        position: absolute;
        left: 34px;
        height: 12px;
        border-radius: 6px;
        background: #d8dce2;
      }
      .specimenBtn {
        position: absolute;
        border-radius: 8px;
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 20px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .specimenBtn.yes {
        background: #2f6df6;
        color: #ffffff;
      }
      .specimenBtn.no {
        background: #ffffff;
        color: #1b1f24;
        border: 1px solid #d8dce2;
      }
      /* Where it was standing a moment ago, and the arc it took to get out of the way. */
      .specimenGhost {
        position: absolute;
        border: 1px dashed #c3c8d0;
        border-radius: 8px;
      }
      .hop {
        position: absolute;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #c3c8d0;
      }
      .cursor {
        position: absolute;
        width: 26px;
        height: 34px;
        background: #1b1f24;
        clip-path: polygon(0 0, 0 78%, 27% 58%, 47% 100%, 66% 88%, 47% 50%, 100% 44%);
      }

      /**
       * ASCII Art Studio: a column of characters resolving out of noise into a shape, which is the whole
       * trick of the tool. Set in the mono face at a fixed line height so the glyphs form a grid.
       */
      .ascii {
        position: absolute;
        top: 0;
        /* The grid is measured to land inside the card: 22 columns at 21px plus 3px of tracking. */
        left: 20px;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 21px;
        line-height: 21px;
        letter-spacing: 3px;
        white-space: pre;
      }
      .asciiRow {
        color: rgba(243, 239, 231, 0.34);
      }

      /**
       * Image Encoder: a block of pixels with one square pulled out and magnified, where the carried bits
       * live. The point is that the change is invisible at size and obvious under the loupe.
       */
      .pixels {
        position: absolute;
        top: 150px;
        left: 60px;
        display: grid;
        grid-template-columns: repeat(10, 26px);
        grid-template-rows: repeat(10, 26px);
        border-radius: 8px;
        overflow: hidden;
      }
      .pixel {
        width: 26px;
        height: 26px;
      }
      .loupe {
        position: absolute;
        top: 236px;
        /* Far enough in that all three columns stay on the card: at 232px the last one ran off it. */
        left: 196px;
        display: grid;
        grid-template-columns: repeat(3, 52px);
        grid-template-rows: repeat(3, 52px);
        border: 2px solid rgba(233, 184, 114, 0.85);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.8);
      }
      .loupeCell {
        width: 52px;
        height: 52px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 17px;
        color: rgba(255, 255, 255, 0.9);
      }

      /**
       * Gulag Sort: the bars it kept, and the gaps where the ones out of order used to be. A sort that
       * removes rather than rearranges should be drawn by what is missing.
       */
      .bars {
        position: absolute;
        bottom: 96px;
        left: 34px;
        display: flex;
        align-items: flex-end;
        gap: 12px;
        height: 380px;
      }
      .bar {
        width: 30px;
        border-radius: 4px 4px 0 0;
        background: rgba(233, 184, 114, 0.75);
      }
      /* What is left of a value that fell out of order: its footprint, and nothing standing on it. */
      .bar.culled {
        background: none;
        border: 1px dashed rgba(243, 239, 231, 0.18);
        border-bottom: 0;
      }

      /* Othello: the board mid-move, with the discs the last play caught still turning over. */
      .board {
        position: absolute;
        top: 96px;
        /* The board's own left edge clears the mask's fade, and the far column runs off the card mid-square
           rather than landing flush with it. */
        left: 60px;
        display: grid;
        grid-template-columns: repeat(8, 54px);
        grid-template-rows: repeat(8, 54px);
        gap: 3px;
        padding: 10px;
        border-radius: 10px;
        background: #17503a;
      }
      .square {
        background: #1f6b4a;
        border-radius: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .disc {
        width: 42px;
        height: 42px;
        border-radius: 50%;
      }
      .disc.dark {
        background: #14161b;
      }
      .disc.light {
        background: #f3efe7;
      }
      /**
       * A disc mid-flip, seen edge-on: it narrows towards the halfway point and shows whichever face is
       * still turned outwards, so the colour switches over rather than blending. Each one in the line is a
       * little further through than the last, which is what makes it read as a flip in progress.
       */
      .disc.turning {
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
      }
      /* The cues the game itself draws: where the next player may legally move, and the disc just laid. */
      .hint {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(233, 184, 114, 0.5);
        border-radius: 50%;
      }
      .square.lastMove {
        box-shadow: inset 0 0 0 2px rgba(233, 184, 114, 0.75);
      }

      /* 4x4x4: the four layers, stacked back to front, with a line running corner to corner through them. */
      .layers {
        position: absolute;
        inset: 0;
      }
      /**
       * Each layer is opaque, so the one in front of it hides everything but its top row. Four transparent
       * grids stacked on each other read as noise; a solid front plate with three edges behind it reads as
       * depth. Painted back to front, and dimmed with distance rather than with opacity — opacity on the
       * layer would make its own background see-through and give the occlusion away.
       */
      .layer {
        position: absolute;
        display: grid;
        grid-template-columns: repeat(4, 48px);
        grid-template-rows: repeat(4, 48px);
        gap: 5px;
        padding: 9px;
        border-radius: 9px;
        background: var(--bg);
        box-shadow: 0 -1px 0 rgba(243, 239, 231, 0.16);
      }
      .cell {
        border: 1px solid var(--cellEdge);
        border-radius: 4px;
      }
      .cell.taken {
        border-color: var(--takenEdge);
        background: var(--takenFill);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glow"></div>
      <div class="stars" id="stars"></div>
      <canvas class="strata" id="strata" width="38" height="63"></canvas>
      <div class="blast" id="blast" hidden></div>
      <div class="edgeArt" id="edgeArt"></div>
      <div class="path" id="path"></div>
      <div class="title" id="title"></div>
      <div class="subtitle" id="subtitle"></div>
      <div class="tags" id="tags"></div>
      <div class="brand"><span class="prompt">&gt;</span>brentbutkow.me</div>
    </div>
    <script>
      const variants = {
        home: {
          path: '~/full-stack-engineer',
          caret: true,
          title: 'Brent Butkow',
          subtitle:
            'Building compliance tools by day and designing wacky projects at night. Loving dad jokes around the clock.',
          tags: [],
        },
        'recall-radar': {
          path: '~/projects/recall-radar',
          title: 'Recall Radar',
          subtitle: [
            'Food-recall tracker across the US, Canada,',
            'UK, EU and South Africa. Updated daily,',
            'with severity ratings and free email alerts.',
          ],
          // The chosen breaks run past the shared 21em column.
          subtitleWidth: '24em',
          tags: ['FDA', 'USDA', 'CFIA', 'FSA', 'RASFF', 'NCC'],
        },
        'pixel-world-simulator': {
          path: '~/fun-stuff/games/pixel-world-simulator',
          title: 'Pixel World Simulator',
          subtitle:
            'A falling-sand sandbox. Draw a world, then flood it, set it alight, blow it up, or leave the ants to tunnel through it.',
          // No tag: a three-line subtitle plus a two-line title already fills the column, and a tag under it
          // ran into the brand line pinned to the bottom. The path above says it is a game.
          tags: [],
          strata: true,
        },
        'null-space': {
          path: '~/fun-stuff/games/null-space',
          title: 'Null Space',
          subtitle:
            'A browser space-defense game where you bend space itself: sling meteors, open black holes, protect your ship.',
          tags: ['Playable in your browser'],
          stars: true,
        },
        experience: {
          path: '~/experience',
          title: 'Experience',
          subtitle:
            'Software engineering roles at Foodcomply, Entelect and RGA, plus earlier internships, with the tech stack used in each.',
          tags: [],
        },
        education: {
          path: '~/education',
          title: 'Education',
          subtitle:
            'A BSc (Eng) in Information Engineering from Wits, graduated with distinction, and an IEB matric before that.',
          tags: [],
        },
        achievements: {
          path: '~/achievements',
          title: 'Achievements',
          subtitle: 'Academic awards, olympiad results and hackathon placings, listed by year.',
          tags: [],
        },
        projects: {
          path: '~/projects',
          title: 'Projects',
          subtitle:
            'The bigger projects, built to be used. Recall Radar tracks food recalls across five regions from six government sources.',
          tags: [],
        },
        'fun-stuff': {
          path: '~/fun-stuff',
          title: 'Fun Stuff',
          subtitle:
            'Includes four browser games, an image encoder, an ASCII art studio, and a joke sorting algorithm.',
          tags: [],
        },
        games: {
          path: '~/fun-stuff/games',
          title: 'Games',
          subtitle:
            'Games that run in the browser with nothing to install, playable against a friend or the computer.',
          tags: ['Null Space', 'Pixel World Simulator', '4×4×4 Tic-Tac-Toe', 'Othello'],
        },
        'course-projects': {
          path: '~/fun-stuff/course-projects',
          title: 'Course Projects',
          subtitle:
            'Projects built for school and university coursework, from a chess AI to a multiplayer drawing game, all on GitHub.',
          tags: [],
        },
        contact: {
          path: '~/contact',
          title: 'Contact',
          subtitle: 'Reach me by email, GitHub or LinkedIn — for work, for fun, or just to say hi.',
          tags: [],
        },
        'ascii-art': {
          path: '~/fun-stuff/ascii-art',
          title: 'ASCII Art Studio',
          subtitle:
            'Point it at a photo, a video, or your webcam, and watch the whole thing come back as characters.',
          tags: ['Runs in the browser'],
          art: 'ascii',
        },
        'image-encoder': {
          path: '~/fun-stuff/image-encoder',
          title: 'Image Encoder',
          subtitle:
            'Hide a message inside a picture by nudging its pixels, lock it with a key, and read it back out later.',
          tags: ['Nothing leaves your machine'],
          art: 'pixels',
        },
        'gulag-sort': {
          path: '~/fun-stuff/gulag-sort',
          title: 'Gulag Sort',
          subtitle:
            'A sorting algorithm that eliminates everything not in order, repeatedly, until the list is sorted.',
          tags: ['Runs in O(n)'],
          art: 'bars',
        },
        'malicious-ux': {
          path: '~/fun-stuff/malicious-ux',
          title: 'Malicious UX',
          subtitle:
            'An exhibition of actively hostile interface design, including buttons that dodge your cursor and settings that undo themselves.',
          tags: ['Every exhibit is live'],
          // Three lines, not four: the fourth drove the tag into the brand line pinned to the bottom. The
          // specimen's left edge is already faded out by 894px, so the text can run wider than the default.
          subtitleWidth: '22em',
          art: 'specimen',
        },
        othello: {
          path: '~/fun-stuff/games/othello',
          title: 'Othello',
          subtitle:
            "The classic game, also called Reversi, where you trap a line of your opponent's discs and they all flip to your colour.",
          tags: ['Three board sizes'],
          art: 'board',
        },
        'tic-tac-toe': {
          path: '~/fun-stuff/games/4x4x4-tic-tac-toe',
          title: '4×4×4 Tic-Tac-Toe',
          subtitle: 'Four in a row on a 4×4 board, except the board is a cube four layers deep.',
          tags: ['Tic-tac-toe just got a big upgrade'],
          // One line at 64px; at the shared 82px it broke mid-word as "Tic-Tac-" / "Toe".
          titleSize: '64px',
          art: 'layers',
        },
      }

      const requested = new URLSearchParams(location.search).get('v')
      // No ?v= means the home card; a ?v= that names nothing is a mistake worth failing on, not a
      // silent home card written over some other project's file.
      const variant = requested === null ? variants.home : variants[requested]
      if (!variant) throw new Error(`og-template: unknown variant "${requested}"`)
      document.getElementById('path').textContent = variant.path
      if (variant.caret) {
        const caret = document.createElement('span')
        caret.className = 'caret'
        document.getElementById('path').appendChild(caret)
      }
      document.getElementById('title').textContent = variant.title
      if (variant.titleSize) document.getElementById('title').style.fontSize = variant.titleSize
      if (variant.subtitleWidth) {
        document.getElementById('subtitle').style.maxWidth = variant.subtitleWidth
      }
      const subtitleEl = document.getElementById('subtitle')
      // An array subtitle picks its own wrap points; a string leaves them to the measurer.
      if (Array.isArray(variant.subtitle)) {
        variant.subtitle.forEach((line, i) => {
          if (i > 0) subtitleEl.appendChild(document.createElement('br'))
          subtitleEl.appendChild(document.createTextNode(line))
        })
      } else {
        subtitleEl.textContent = variant.subtitle
      }
      // A card with no tags drops the row entirely, so its text block sits where a tagged card's does.
      const tagsEl = document.getElementById('tags')
      if (variant.tags.length === 0) tagsEl.hidden = true
      for (const label of variant.tags) {
        const tag = document.createElement('span')
        tag.className = 'tag'
        tag.textContent = label
        tagsEl.appendChild(tag)
      }
      if (variant.strata) {
        // The material colours come from the sim's own table (engine/materials.ts). Copied rather than
        // imported: this file is rendered by Chrome on its own, with no build step to pull TypeScript in.
        const SKY = null
        const SAND = [214, 172, 96]
        const DIRT = [110, 78, 52]
        const STONE = [122, 124, 130]
        const WATER = [62, 122, 186]
        const LAVA = [226, 104, 38]
        const PLANT = [78, 148, 66]
        const FIRE = [255, 168, 60]
        const EMBER = [255, 214, 132]
        const SMOKE = [116, 112, 108]
        const ASH = [92, 88, 86]

        // Deterministic, so regenerating the card gives the same world back.
        let s2 = 1337
        const r2 = () => (s2 = (s2 * 16807) % 2147483647) / 2147483647
        document.querySelector('.card').classList.add('hasStrata')
        const canvas = document.getElementById('strata')
        const ctx = canvas.getContext('2d')
        const { width: W, height: H } = canvas

        // A surface that wanders, a pool worn into it, and the layers underneath — the shape every preset has.
        // Low enough that the ground sits under the title rather than through it, with a dip worn into it.
        const surface = []
        let level = 34
        for (let x = 0; x < W; x++) {
          level += Math.round(r2() * 2 - 1)
          level = Math.max(30, Math.min(38, level))
          surface.push(x > 12 && x < 26 ? level + 7 : level)
        }

        const put = (x, y, rgb, jitter) => {
          if (!rgb) return
          const shade = jitter ? Math.round((r2() * 2 - 1) * jitter) : 0
          ctx.fillStyle = `rgb(${rgb[0] + shade} ${rgb[1] + shade} ${rgb[2] + shade})`
          ctx.fillRect(x, y, 1, 1)
        }

        for (let x = 0; x < W; x++) {
          const top = surface[x]
          const pooled = x > 13 && x < 25
          for (let y = 0; y < H; y++) {
            if (y < top) {
              // Water fills the dip to the level of the ground around it; above that, the odd grain still
              // falling out of the sky.
              if (pooled && y >= surface[2]) put(x, y, WATER, 12)
              else if (r2() < 0.014) put(x, y, SAND, 18)
              continue
            }
            if (y < top + 2) put(x, y, pooled ? DIRT : SAND, 16)
            else if (y < top + 12) put(x, y, DIRT, 12)
            else put(x, y, STONE, 10)
          }
          // A little growth along the dry ground, and a vein of lava deep down.
          if (!pooled && r2() < 0.14) put(x, top - 1, PLANT, 14)
          if (r2() < 0.1) put(x, H - 4 - Math.round(r2() * 3), LAVA, 20)
        }

        // Something just went off in the right-hand shoulder of the ground: a charge takes a bite out of the
        // terrain, throws what it removed, and leaves the hole burning. The whole card is one frame of that.
        const bx = 30
        const by = 36
        const CRATER = 6
        for (let dy = -CRATER; dy <= CRATER; dy++) {
          for (let dx = -CRATER; dx <= CRATER; dx++) {
            const away = Math.sqrt(dx * dx + dy * dy)
            // A ragged rim rather than a compass circle — a clean disc is the shape that always reads as a bug.
            if (away > CRATER - r2() * 1.8) continue
            const x = bx + dx
            const y = by + dy
            if (x < 0 || x >= W || y < 0 || y >= H) continue
            ctx.clearRect(x, y, 1, 1)
            // The bottom of the hole is still alight, the rim only scorched.
            if (away < CRATER * 0.45) put(x, y, r2() < 0.35 ? EMBER : FIRE, 22)
            else if (away < CRATER * 0.7 && r2() < 0.3) put(x, y, FIRE, 26)
          }
        }

        // What the blast threw: debris on its way out, embers above it, and smoke taking over higher up.
        for (let i = 0; i < 90; i++) {
          const angle = -Math.PI * r2()
          const reach = CRATER + r2() * 16
          const x = Math.round(bx + Math.cos(angle) * reach)
          const y = Math.round(by + Math.sin(angle) * reach * 0.85)
          if (x < 0 || x >= W || y < 0 || y >= H) continue
          const height = by - y
          if (height > 12) put(x, y, r2() < 0.5 ? SMOKE : ASH, 10)
          else if (r2() < 0.4) put(x, y, r2() < 0.5 ? EMBER : FIRE, 24)
          else put(x, y, r2() < 0.5 ? DIRT : STONE, 14)
        }

        document.getElementById('blast').hidden = false
      }

      if (variant.art) {
        document.querySelector('.card').classList.add('hasEdgeArt')
        const edge = document.getElementById('edgeArt')
        const add = (className, style, parent = edge) => {
          const node = document.createElement('div')
          node.className = className
          Object.assign(node.style, style)
          parent.appendChild(node)
          return node
        }

        if (variant.art === 'specimen') {
          const panel = add('specimen', {})
          add('specimenLine', { top: '44px', width: '250px' }, panel)
          add('specimenLine', { top: '72px', width: '180px' }, panel)
          // The pen it is confined to, the spot it left, and the hops that got it clear of the cursor.
          add(
            'specimenGhost',
            { left: '34px', top: '150px', width: '108px', height: '44px' },
            panel
          )
          add('cursor', { left: '58px', top: '176px' }, panel)
          for (const [left, top] of [
            [150, 168],
            [186, 190],
            [214, 160],
          ]) {
            add('hop', { left: left + 'px', top: top + 'px' }, panel)
          }
          const no = add(
            'specimenBtn no',
            {
              left: '238px',
              top: '124px',
              width: '84px',
              height: '44px',
            },
            panel
          )
          no.textContent = 'No'
          const yes = add(
            'specimenBtn yes',
            {
              left: '34px',
              top: '260px',
              width: '184px',
              height: '48px',
            },
            panel
          )
          yes.textContent = 'Yes, I consent'
        }

        if (variant.art === 'ascii') {
          const holder = add('ascii', {})
          // Deterministic, so the same card comes back every time it is regenerated.
          let seed = 8675309
          const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647
          const RAMP = ' .:-=+*#%@'
          const COLUMNS = 22
          const ROWS = 22
          // A soft shape in the middle of the frame: brightness falls off with distance from its centre,
          // so the ramp resolves into a form near the middle and dissolves into speckle at the edges.
          for (let row = 0; row < ROWS; row++) {
            let line = ''
            for (let column = 0; column < COLUMNS; column++) {
              const dx = (column - COLUMNS * 0.52) / (COLUMNS * 0.42)
              const dy = (row - ROWS * 0.5) / (ROWS * 0.46)
              const away = Math.sqrt(dx * dx + dy * dy)
              const light = Math.max(0, 1 - away) + (rand() - 0.5) * 0.22
              const step = Math.round(Math.min(1, Math.max(0, light)) * (RAMP.length - 1))
              line += RAMP[step]
            }
            add('asciiRow', {}, holder).textContent = line
          }
        }

        if (variant.art === 'pixels') {
          const grid = add('pixels', {})
          let seed = 20250807
          const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647
          // A picture worth hiding something in, then a magnified read-out beside it — its own cells, not
          // the grid's — showing the low bits that carry the message.
          const shade = () => {
            const base = 40 + Math.round(rand() * 60)
            return `rgb(${base + 30} ${base + 70} ${base + 110})`
          }
          for (let cell = 0; cell < 100; cell++) add('pixel', { background: shade() }, grid)

          const loupe = add('loupe', {})
          for (let cell = 0; cell < 9; cell++) {
            const node = add('loupeCell', { background: shade() }, loupe)
            node.textContent = rand() < 0.5 ? '0' : '1'
          }
        }

        if (variant.art === 'bars') {
          const row = add('bars', {})
          // A run that only ever climbs, because everything that dipped has been removed. The gaps are the
          // values it deleted, still in their original places.
          // Eight columns is what fits before the card edge; fourteen ran off it and lost the peak.
          const heights = [58, 0, 118, 0, 186, 244, 0, 316]
          for (const height of heights) {
            const culled = height === 0
            add(culled ? 'bar culled' : 'bar', { height: (culled ? 74 : height) + 'px' }, row)
          }
        }

        if (variant.art === 'board') {
          const board = add('board', {})
          /**
           * A position reached by playing it out, rather than one arranged to look tidy: from the opening
           * four, black (3,4), white (4,4), black (4,3), and white has just played (4,2), which catches
           * (3,2) and (4,3) from two directions at once.
           *
           * Arranging discs by eye does not work here. Every legal position descends from the opening four
           * by flipping, and a play must flip something, so those four squares are the most churned on the
           * board — leaving them pristine under a tidy line below is a position no game can produce.
           *
           * The cluster sits two squares in from the top and left, which is what the crop needs: the card
           * shows the board's top-left corner, and further in left the run of empty rows above it too long.
           */
          const dark = new Set(['2,3', '3,3', '3,4'])
          const light = new Set(['2,2', '4,4'])
          const lastMove = '4,2'
          /**
           * Both were caught by the same play, so both are going the same way: black to white. They are
           * staggered, but both past the halfway point, because that is where white's face has come round.
           * One still showing black read as two unrelated things happening rather than one flip.
           *
           * Neither sits near side-on either: a disc at exactly halfway is a line rather than a disc, and
           * reads as a rendering fault.
           */
          const turning = new Map([
            ['3,2', 0.88],
            ['4,3', 0.68],
          ])
          // Where black may legally answer. Both of these are sandwiches against discs that have already
          // settled, so they hold whether or not the turning pair has finished.
          const hints = new Set(['2,1', '1,1'])
          for (let row = 0; row < 8; row++) {
            for (let column = 0; column < 8; column++) {
              const square = add('square', {}, board)
              const at = `${column},${row}`
              if (at === lastMove) square.classList.add('lastMove')
              if (hints.has(at)) add('hint', {}, square)
              else if (at === lastMove) add('disc light', {}, square)
              else if (dark.has(at)) add('disc dark', {}, square)
              else if (light.has(at)) add('disc light', {}, square)
              else if (turning.has(at)) {
                const through = turning.get(at)
                // Past halfway the far face has come round, so the disc is already the new colour.
                const face = through > 0.5 ? 'light' : 'dark'
                add(
                  `disc ${face} turning`,
                  {
                    width:
                      Math.max(16, Math.round(42 * Math.abs(Math.cos(through * Math.PI)))) + 'px',
                  },
                  square
                )
              }
            }
          }
        }

        if (variant.art === 'layers') {
          const layers = add('layers', {})
          // A diagonal through the cube: one cell per layer, stepping across a column each layer down
          // — a winning line that stays visible in every layer's exposed top row.
          for (let depth = 0; depth < 4; depth++) {
            const layer = add(
              'layer',
              {
                left: 64 + depth * 12 + 'px',
                // Stepped by less than one cell, so each layer behind shows only its top row.
                top: 108 + depth * 46 + 'px',
                zIndex: String(depth),
              },
              layers
            )
            const distance = 3 - depth
            layer.style.setProperty('--cellEdge', `rgba(243, 239, 231, ${0.3 - distance * 0.06})`)
            layer.style.setProperty('--takenEdge', `rgba(233, 184, 114, ${0.9 - distance * 0.16})`)
            layer.style.setProperty('--takenFill', `rgba(233, 184, 114, ${0.3 - distance * 0.06})`)
            for (let row = 0; row < 4; row++) {
              for (let column = 0; column < 4; column++) {
                add(column === depth && row === 0 ? 'cell taken' : 'cell', {}, layer)
              }
            }
          }
        }
      }

      if (variant.stars) {
        // Deterministic pseudo-random starfield so regenerating gives the same image.
        let seed = 42
        const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647
        const stars = document.getElementById('stars')
        for (let i = 0; i < 70; i++) {
          const star = document.createElement('span')
          const size = 1 + rand() * 2.5
          star.style.width = star.style.height = size + 'px'
          star.style.left = rand() * 1200 + 'px'
          star.style.top = rand() * 630 + 'px'
          star.style.opacity = 0.25 + rand() * 0.6
          stars.appendChild(star)
        }
      }
    </script>
  </body>
</html>
