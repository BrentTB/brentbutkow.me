<!doctype html>
<!--
  Favicon generator — a circular "BB" monogram in the site's brand style (gold on ink).
  The page background is transparent, so the corners outside the circle export as transparent.
  Export:
    • DevTools → Elements → right-click <div class="icon"> → "Capture node screenshot"
      → 512×512 PNG with transparent corners (a circle).
    • CLI:  npx capture-website-cli favicon.template.html --element=".icon" --output=favicon-512.png
    • Then turn that PNG into icons however you like (e.g. realfavicongenerator.net) and drop the
      results in /public, or just use the PNG directly:
        <link rel="icon" type="image/png" href="/favicon.png" />
  Tweak size/tracking/colour below; values mirror src/index.scss tokens.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Transparent so the icon's corners export clear (circular), not on a backdrop. */
        background: transparent;
      }

      .icon {
        width: 512px;
        height: 512px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 150px;
        background-color: #0b0c0f;
        background-image: radial-gradient(
          130% 130% at 50% 14%,
          rgba(233, 184, 114, 0.22),
          transparent 60%
        );
        box-shadow: inset 0 0 0 6px rgba(233, 184, 114, 0.14);
        font-family: 'Fraunces', Georgia, serif;
      }

      .bb {
        /* Fraunces — the original optical serif: high stroke contrast + ball terminals
           give "BB" real character. opsz: auto pushes the contrast up at this size. */
        font-family: 'Fraunces', Georgia, serif;
        font-optical-sizing: auto;
        font-weight: 600;
        font-size: 320px;
        letter-spacing: -0.015em;
        line-height: 1;
        color: #e9b872;
      }
    </style>
  </head>
  <body>
    <div class="icon"><span class="bb">BB</span></div>
  </body>
</html>
