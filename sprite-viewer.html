<!doctype html>
<!-- Dev-only sprite viewer. Run `npm run dev` and open http://localhost:5173/sprite-viewer.html
     Imports SPRITE_MAP directly from sprites.ts, so it always shows the current art (with HMR). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Null Space — Sprite Viewer</title>
    <style>
      :root {
        --bg: #0a0e1a;
        --card: #11182a;
        --border: #232c42;
        --text: #f3efe7;
        --muted: #8a93a8;
        --gold: #e9b872;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'SF Mono', 'Fira Code', Menlo, monospace;
      }
      header {
        position: sticky;
        top: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1.5rem;
        padding: 0.75rem 1.25rem;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid var(--border);
      }
      h1 {
        margin: 0;
        font-size: 1rem;
        color: var(--gold);
        font-weight: 600;
      }
      label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8rem;
        color: var(--muted);
      }
      input[type='range'] {
        accent-color: var(--gold);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 1rem;
        padding: 1.25rem;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6rem;
        padding: 1rem 0.5rem 0.75rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .card.checker canvas {
        background: repeating-conic-gradient(#1c2438 0% 25%, #141b2d 0% 50%) 0 0 / 16px 16px;
      }
      .stage {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1;
        min-height: 120px;
      }
      .name {
        font-size: 0.78rem;
        color: var(--text);
      }
      .dims {
        font-size: 0.68rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Null Space — Sprites</h1>
      <label>
        scale
        <input id="scale" type="range" min="2" max="12" value="6" />
        <span id="scale-value">6×</span>
      </label>
      <label>
        <input id="checker" type="checkbox" />
        checker background
      </label>
      <label id="count"></label>
    </header>
    <main class="grid" id="grid"></main>

    <script type="module">
      import { SPRITE_MAP } from '/src/pages/FunStuff/subpages/NullSpace/renderer/sprites.ts'

      const grid = document.getElementById('grid')
      const scaleInput = document.getElementById('scale')
      const scaleValue = document.getElementById('scale-value')
      const checkerInput = document.getElementById('checker')
      const count = document.getElementById('count')

      const entries = Object.entries(SPRITE_MAP)
      count.textContent = `${entries.length} sprites`

      const cards = entries.map(([key, data]) => {
        const card = document.createElement('div')
        card.className = 'card'
        const stage = document.createElement('div')
        stage.className = 'stage'
        const canvas = document.createElement('canvas')
        stage.appendChild(canvas)
        const name = document.createElement('div')
        name.className = 'name'
        name.textContent = key
        const dims = document.createElement('div')
        dims.className = 'dims'
        dims.textContent = `${data[0].length}×${data.length}`
        card.append(stage, name, dims)
        grid.appendChild(card)
        return { card, canvas, data }
      })

      function draw(scale) {
        for (const { canvas, data } of cards) {
          canvas.width = data[0].length * scale
          canvas.height = data.length * scale
          const ctx = canvas.getContext('2d')
          data.forEach((row, y) =>
            row.forEach((color, x) => {
              if (!color) return
              ctx.fillStyle = color
              ctx.fillRect(x * scale, y * scale, scale, scale)
            })
          )
        }
      }

      scaleInput.addEventListener('input', () => {
        scaleValue.textContent = `${scaleInput.value}×`
        draw(Number(scaleInput.value))
      })
      checkerInput.addEventListener('change', () => {
        for (const { card } of cards) card.classList.toggle('checker', checkerInput.checked)
      })

      draw(Number(scaleInput.value))
    </script>
  </body>
</html>
